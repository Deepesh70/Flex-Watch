name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci-checks:
    name: Fullstack CI (Backend & Frontend)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'file:./dev.db'
      CI: 'true'
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.REACT_APP_CLERK_PUBLISHABLE_KEY }}
      REACT_APP_CLERK_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }} 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      # --- Backend Checks ---
      - name: Validate Prisma Schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: Initialize Test Database & Generate Prisma Client
        run: npm run db:push
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: Run Backend Tests
        run: npm run test:backend
        env:
          DATABASE_URL: 'file:./dev.db'

      # --- Frontend Checks ---
      - name: Run Frontend Tests
        run: npm run test:frontend
        env:
          CI: true

      - name: Build Production Bundle
        run: npm run build
        env:
          CI: true
