services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: flexwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flexwatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flexwatch_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flexwatch_user} -d $${POSTGRES_DB:-flexwatch_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: flexwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Backend API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flexwatch-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-flexwatch_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flexwatch_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      TRUST_PROXY: "1"
      CORS_ORIGIN: "http://localhost"
    ports:
      - "5000:5000"

  # 4. Frontend Web (Nginx Reverse Proxy)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flexwatch-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
