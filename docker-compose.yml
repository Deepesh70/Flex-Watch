services:
  # 1. Redis Distributed L2 Cache
  redis:
    image: redis:7-alpine
    container_name: flexwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Backend API Server (BFF)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flexwatch-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "file:./dev.db"
      REDIS_URL: "redis://redis:6379"
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      TRUST_PROXY: "1"
      CORS_ORIGIN: "http://localhost"
    volumes:
      - dbdata:/app/prisma
    ports:
      - "5000:5000"

  # 3. Frontend Web (Nginx Reverse Proxy & Static Host)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flexwatch-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  dbdata:
  redisdata:
